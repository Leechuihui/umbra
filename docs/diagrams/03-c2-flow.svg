<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5fe0c8"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c97070"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef5d8"/>
      <stop offset="1" stop-color="#2b7f72"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <text x="600" y="48" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="600" letter-spacing="1">C2 通信完整流程</text>
  <text x="600" y="76" text-anchor="middle" fill="#6e6e6e" font-size="14">从部署到会话上线的 8 个步骤</text>
  <line x1="490" y1="92" x2="710" y2="92" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Lifelines -->
  <line x1="180" y1="130" x2="180" y2="820" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="480" y1="130" x2="480" y2="820" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="780" y1="130" x2="780" y2="820" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="1050" y1="130" x2="1050" y2="820" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Actor headers -->
  <rect x="100" y="130" width="160" height="44" rx="8" fill="#161616" stroke="#2f2f2f"/>
  <text x="180" y="158" text-anchor="middle" fill="#e8e8e8" font-size="14" font-weight="600">操作员</text>

  <rect x="400" y="130" width="160" height="44" rx="8" fill="#1a2b28" stroke="#5fe0c8"/>
  <text x="480" y="158" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">客户端</text>

  <rect x="700" y="130" width="160" height="44" rx="8" fill="#1a2b28" stroke="#5fe0c8"/>
  <text x="780" y="158" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">服务端</text>

  <rect x="970" y="130" width="160" height="44" rx="8" fill="#1d1414" stroke="#c97070"/>
  <text x="1050" y="158" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">植入体</text>

  <!-- Step 1 -->
  <circle cx="180" cy="215" r="13" fill="#5fe0c8"/>
  <text x="180" y="220" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">1</text>
  <text x="205" y="220" fill="#b0b0b0" font-size="13">生成操作员密钥</text>
  <text x="205" y="240" fill="#5a5a5a" font-size="11.5" font-family="Consolas, monospace">./umbra.py server key add admin</text>

  <!-- Step 2 -->
  <circle cx="780" cy="285" r="13" fill="#5fe0c8"/>
  <text x="780" y="290" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">2</text>
  <text x="805" y="290" fill="#b0b0b0" font-size="13">启动服务端</text>
  <text x="805" y="310" fill="#5a5a5a" font-size="11.5" font-family="Consolas, monospace">listen 0.0.0.0:9000</text>

  <!-- Step 3: login -->
  <line x1="480" y1="365" x2="778" y2="365" stroke="#5fe0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="480" cy="365" r="13" fill="#5fe0c8"/>
  <text x="480" y="370" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">3</text>
  <text x="630" y="355" text-anchor="middle" fill="#5fe0c8" font-size="12.5" font-weight="600">POST /auth/login</text>
  <text x="630" y="383" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Consolas, monospace">{user, pass, secret}</text>

  <!-- Step 4: token back -->
  <line x1="778" y1="425" x2="482" y2="425" stroke="#5fe0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="780" cy="425" r="13" fill="#5fe0c8"/>
  <text x="780" y="430" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">4</text>
  <text x="630" y="415" text-anchor="middle" fill="#5fe0c8" font-size="12.5" font-weight="600">返回 JWT Token</text>
  <text x="630" y="443" text-anchor="middle" fill="#6e6e6e" font-size="11">有效期 7 天 · 写入 config.json</text>

  <!-- Step 5: create listener -->
  <line x1="480" y1="500" x2="778" y2="500" stroke="#5fe0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="480" cy="500" r="13" fill="#5fe0c8"/>
  <text x="480" y="505" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">5</text>
  <text x="630" y="490" text-anchor="middle" fill="#5fe0c8" font-size="12.5" font-weight="600">创建监听器</text>
  <text x="630" y="518" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Consolas, monospace">POST /api/listeners/ → :8080</text>

  <!-- Step 6: build implant -->
  <line x1="480" y1="575" x2="778" y2="575" stroke="#5fe0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="480" cy="575" r="13" fill="#5fe0c8"/>
  <text x="480" y="580" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">6</text>
  <text x="630" y="565" text-anchor="middle" fill="#5fe0c8" font-size="12.5" font-weight="600">生成植入体</text>
  <text x="630" y="593" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Consolas, monospace">POST /api/implants/ → exe</text>

  <!-- Step 7: implant runs and connects -->
  <circle cx="1050" cy="650" r="13" fill="#c97070"/>
  <text x="1050" y="655" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">7</text>
  <text x="1075" y="655" fill="#e8e8e8" font-size="13">目标机执行</text>
  <text x="1075" y="675" fill="#8a5a5a" font-size="11.5" font-family="Consolas, monospace">implant.exe</text>

  <line x1="1050" y1="700" x2="782" y2="700" stroke="#c97070" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="916" y="690" text-anchor="middle" fill="#c97070" font-size="12.5" font-weight="600">反向回连（心跳）</text>
  <text x="916" y="718" text-anchor="middle" fill="#6e6e6e" font-size="11" font-family="Consolas, monospace">→ 192.168.1.38:8080</text>

  <!-- Step 8: session online -->
  <line x1="778" y1="765" x2="482" y2="765" stroke="#5fe0c8" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="780" cy="765" r="13" fill="#5fe0c8"/>
  <text x="780" y="770" text-anchor="middle" fill="#0a0a0a" font-size="12" font-weight="700">8</text>
  <text x="630" y="755" text-anchor="middle" fill="#5fe0c8" font-size="12.5" font-weight="600">会话上线</text>
  <text x="630" y="783" text-anchor="middle" fill="#6e6e6e" font-size="11">客户端轮询 / 长连接获取新会话</text>

  <!-- Footer -->
  <text x="600" y="870" text-anchor="middle" fill="#3a3a3a" font-size="11">UMBRA · Post Exploitation Framework · github.com/Leechuihui/umbra</text>
</svg>
