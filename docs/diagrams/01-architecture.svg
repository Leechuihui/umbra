<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5fe0c8"/>
    </marker>
    <marker id="arrowDim" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6a6a6a"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101010"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ef5d8"/>
      <stop offset="1" stop-color="#2b7f72"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" fill="#ffffff" font-size="28" font-weight="600" letter-spacing="1">UMBRA 三层架构</text>
  <text x="600" y="82" text-anchor="middle" fill="#6e6e6e" font-size="15">Three-Layer C2 Architecture</text>
  <line x1="480" y1="98" x2="720" y2="98" stroke="url(#accentGrad)" stroke-width="2"/>

  <!-- Layer labels -->
  <text x="200" y="150" text-anchor="middle" fill="#5fe0c8" font-size="13" letter-spacing="2">LAYER 1</text>
  <text x="600" y="150" text-anchor="middle" fill="#5fe0c8" font-size="13" letter-spacing="2">LAYER 2</text>
  <text x="1000" y="150" text-anchor="middle" fill="#5fe0c8" font-size="13" letter-spacing="2">LAYER 3</text>

  <!-- Client box -->
  <rect x="60" y="175" width="280" height="230" rx="12" fill="#161616" stroke="#2f2f2f" stroke-width="1.5"/>
  <rect x="60" y="175" width="280" height="44" rx="12" fill="#1d1d1d"/>
  <rect x="60" y="207" width="280" height="12" fill="#1d1d1d"/>
  <circle cx="88" cy="197" r="7" fill="#5fe0c8"/>
  <text x="108" y="202" fill="#e8e8e8" font-size="17" font-weight="600">操作员客户端</text>
  <text x="80" y="245" fill="#8a8a8a" font-size="13">Electron + React</text>
  <line x1="80" y1="258" x2="320" y2="258" stroke="#252525"/>
  <text x="80" y="282" fill="#a8a8a8" font-size="13">· 图形化操作界面</text>
  <text x="80" y="305" fill="#a8a8a8" font-size="13">· 多工作区管理</text>
  <text x="80" y="328" fill="#a8a8a8" font-size="13">· 双语 / 主题切换</text>
  <text x="80" y="351" fill="#a8a8a8" font-size="13">· 命令面板 Ctrl+K</text>
  <text x="80" y="382" fill="#5a5a5a" font-size="12" font-style="italic">可随时关闭，不影响植入体</text>

  <!-- Server box -->
  <rect x="460" y="175" width="280" height="230" rx="12" fill="#161616" stroke="#5fe0c8" stroke-width="2"/>
  <rect x="460" y="175" width="280" height="44" rx="12" fill="#1a2b28"/>
  <rect x="460" y="207" width="280" height="12" fill="#1a2b28"/>
  <circle cx="488" cy="197" r="7" fill="#7ef5d8"/>
  <text x="508" y="202" fill="#ffffff" font-size="17" font-weight="600">团队服务器</text>
  <text x="480" y="245" fill="#8a8a8a" font-size="13">Python + FastAPI</text>
  <line x1="480" y1="258" x2="720" y2="258" stroke="#252525"/>
  <text x="480" y="282" fill="#a8a8a8" font-size="13">· 接收植入体回连</text>
  <text x="480" y="305" fill="#a8a8a8" font-size="13">· 存储会话与数据</text>
  <text x="480" y="328" fill="#a8a8a8" font-size="13">· 下发指令 / 回传结果</text>
  <text x="480" y="351" fill="#a8a8a8" font-size="13">· JWT 认证（7 天）</text>
  <text x="480" y="382" fill="#5fe0c8" font-size="12" font-weight="600">监听 0.0.0.0:9000</text>

  <!-- Implant box -->
  <rect x="860" y="175" width="280" height="230" rx="12" fill="#161616" stroke="#2f2f2f" stroke-width="1.5"/>
  <rect x="860" y="175" width="280" height="44" rx="12" fill="#1d1d1d"/>
  <rect x="860" y="207" width="280" height="12" fill="#1d1d1d"/>
  <circle cx="888" cy="197" r="7" fill="#c97070"/>
  <text x="908" y="202" fill="#e8e8e8" font-size="17" font-weight="600">植入体</text>
  <text x="880" y="245" fill="#8a8a8a" font-size="13">Nim / Go</text>
  <line x1="880" y1="258" x2="1120" y2="258" stroke="#252525"/>
  <text x="880" y="282" fill="#a8a8a8" font-size="13">· 运行在目标机器</text>
  <text x="880" y="305" fill="#a8a8a8" font-size="13">· 主动反向回连</text>
  <text x="880" y="328" fill="#a8a8a8" font-size="13">· 心跳保活（延迟+抖动）</text>
  <text x="880" y="351" fill="#a8a8a8" font-size="13">· 执行指令并回传</text>
  <text x="880" y="382" fill="#5a5a5a" font-size="12" font-style="italic">只知道服务端地址</text>

  <!-- Arrow: Client <-> Server -->
  <line x1="340" y1="255" x2="458" y2="255" stroke="#5fe0c8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="458" y1="285" x2="340" y2="285" stroke="#5fe0c8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="399" y="243" text-anchor="middle" fill="#5fe0c8" font-size="12" font-weight="600">HTTP API</text>
  <text x="399" y="305" text-anchor="middle" fill="#6e6e6e" font-size="11">Bearer Token</text>

  <!-- Arrow: Implant -> Server (reverse) -->
  <line x1="860" y1="270" x2="742" y2="270" stroke="#c97070" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="801" y="258" text-anchor="middle" fill="#c97070" font-size="12" font-weight="600">反向连接</text>
  <text x="801" y="292" text-anchor="middle" fill="#6e6e6e" font-size="11">Reverse</text>

  <!-- No direct link note -->
  <path d="M340 420 Q600 480 860 420" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
  <text x="600" y="470" text-anchor="middle" fill="#8a3a3a" font-size="13" font-weight="600">✕ 客户端与植入体永不直接通信</text>

  <!-- Bottom: why design -->
  <rect x="120" y="510" width="960" height="160" rx="10" fill="#121212" stroke="#242424"/>
  <text x="150" y="542" fill="#5fe0c8" font-size="14" font-weight="600">为什么这样设计？</text>

  <text x="150" y="575" fill="#b0b0b0" font-size="13">1. 客户端可随时关机，植入体依然在线，数据不丢失</text>
  <text x="150" y="602" fill="#b0b0b0" font-size="13">2. 植入体被逆向分析，也拿不到操作员凭据（只知道服务端地址）</text>
  <text x="150" y="629" fill="#b0b0b0" font-size="13">3. 多个操作员可同时管理同一批植入体，由服务端统一协调</text>
  <text x="150" y="656" fill="#b0b0b0" font-size="13">4. 服务端无状态设计（JWT），重启不影响已认证的客户端</text>

  <!-- Footer -->
  <text x="600" y="700" text-anchor="middle" fill="#3a3a3a" font-size="11">UMBRA · Post Exploitation Framework · github.com/Leechuihui/umbra</text>
</svg>
